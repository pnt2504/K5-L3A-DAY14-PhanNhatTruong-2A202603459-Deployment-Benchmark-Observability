services:
  agent:
    build: .
    ports:
      - "127.0.0.1:${PORT:-8000}:${PORT:-8000}"
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "${PORT:-8000}"
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10
    volumes:
      - redis-data:/data

volumes:
  redis-data:
